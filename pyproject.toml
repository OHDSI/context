[project]
name = "context"
version = "2026.11.26a2"
description = "A python library to embed knowledge graphs for context-aware prediction modeling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.2.0",
    "filelock>=3.16.1",
    "hypll>=0.1.1",
    "igraph>=0.11.8",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numpy>=2.2",
    "polars>=1.17.1",
    "pyarrow>=19.0.0",
    "rustworkx>=0.15.1",
    "scipy>=1.15.1",
    "simple-parsing>=0.1.7",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["context"]

[tool.setuptools.data-files]
"share/ohdsi-context/R" = ["R/extractPlpConcepts.R"]
